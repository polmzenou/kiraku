<!doctype html>
<!-- Page hors ligne du service worker (public/sw.js). Statique, sans script, dans les deux langues :
     elle est servie quand le réseau ne répond pas, sans next-intl ni serveur. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15120F" />
    <title>Kiraku · Hors ligne</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #15120f;
        color: #f1e9da;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; display: flex; flex-direction: column; gap: 16px; align-items: center; }
      .seal {
        width: 64px; height: 64px; border-radius: 8px; background: #c8372d; color: #f3ecdf;
        display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700;
      }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 0; color: #a89f92; line-height: 1.5; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px;
        border-radius: 8px; background: #c8372d; color: #f3ecdf; font-weight: 600; text-decoration: none;
      }
      hr { width: 48px; border: 0; border-top: 1px solid #3a322a; }
    </style>
  </head>
  <body>
    <main>
      <div class="seal" aria-hidden="true" lang="ja">気楽</div>
      <h1>Pas de connexion</h1>
      <p>Kiraku a besoin d'internet : tirages, Zeni et combats sont décidés par le serveur. Reviens quand le réseau est de retour.</p>
      <hr />
      <p lang="en">You are offline. Kiraku needs the internet: draws, Zeni and battles are decided by the server.</p>
      <a href="/">Réessayer · Try again</a>
    </main>
  </body>
</html>
